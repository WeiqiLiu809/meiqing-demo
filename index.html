    <table class="qt"><tr><th>品类</th><th>${q.metric}（元）</th><th>占比</th></tr>${q.rows.map((r, i) => `<tr class="${i ? '' : 'top'}"><td>${r.name}</td><td>${num(r.value)}</td><td>${pct(r.share)}</td></tr>`).join('')}
      <tr><td>合计</td><td>${num(q.total)}</td><td>100%</td></tr></table>
    ${q.rows.map(r => `<div class="hbar"><span>${r.name}</span><span class="b"><i style="width:${r.value / max * 100}%"></i></span><span class="v">${num(r.value)}</span></div>`).join('')}
    ${sourceFoot(q)}`;
}
function compareCard(q){
  const top = q.rows[0];
  const word = c => c < 0 ? '少了' : '多了';
  const lead = q.rows.length === 1
    ? `${top.name}${q.metric}从 ${num(top.previous)} 元变成 ${num(top.current)} 元，${word(top.change)} ${num(Math.abs(top.change))} 元（${spct(top.pct)}）。`
    : `${q.metric}变化最大的是${top.name}：从 ${num(top.previous)} 元变成 ${num(top.current)} 元，${word(top.change)} ${num(Math.abs(top.change))} 元（${spct(top.pct)}）。四个品类合计${word(q.total.change)} ${num(Math.abs(q.total.change))} 元。`;
  return `<div class="engine">对比查询</div><div class="ar-title">${q.rows.length === 1 ? top.name + q.metric + '：' : '各品类' + q.metric + '：'}${rng(q.period)} 对比 ${rng(q.base)}</div>
    <div class="ar-lead">${lead}</div>
    <table class="qt"><tr><th>品类</th><th>本期（元）</th><th>前一周（元）</th><th>变化（元）</th><th>变化率</th></tr>
      ${q.rows.map((r, i) => `<tr class="${i || q.rows.length === 1 ? '' : 'top'}"><td>${r.name}</td><td>${num(r.current)}</td><td>${num(r.previous)}</td><td class="${r.change < 0 ? 'down' : 'up'}">${r.change > 0 ? '+' : ''}${num(r.change)}</td><td>${r.pct === null ? '不适用' : spct(r.pct)}</td></tr>`).join('')}
      ${q.total ? `<tr><td>合计</td><td>${num(q.total.current)}</td><td>${num(q.total.previous)}</td><td>${q.total.change > 0 ? '+' : ''}${num(q.total.change)}</td><td></td></tr>` : ''}</table>
    ${sourceFoot(q)}`;
}

// ---------- 归因 ----------
function walk(n, fn){ if (!n) return; fn(n); (n.children || []).forEach(c => walk(c, fn)); }
function nodeById(c, id){ let r = null; walk(c.decomposition, n => { if (n.id === id) r = n; }); return r; }
const cls = c => Math.abs(c) < 0.5 ? 'zero' : c > 0 ? 'pos' : '';
function val(metric, unit, v){ if (v === null || v === undefined) return '无'; return metric === '退款率' ? pct(v) : `${num(v)} ${unit}`; }
function effect(c, unit){ if (Math.abs(c) < 0.5) return '没有影响'; return `${c < 0 ? '拉低' : '拉高'} ${num(Math.abs(c))} ${unit}`; }
function shareText(n){ const s = n.share_of_root; if (s === null) return ''; if (s > 1) return '超过总变化'; if (s < 0) return '方向相反'; return `占总变化 ${Math.round(s * 100)}%`; }
function pathShort(c){
  const ns = c.primary_path.map(id => nodeById(c, id));
  return ns.map((n, i) => {
    if (i === 0) return n.label.replace(/ · /g, ' ');
    const added = Object.keys(n.filter).filter(k => ns[i - 1].filter[k] !== n.filter[k]).map(k => n.filter[k]);
    return added.length ? added.join(' ') : n.metric;
  }).join(' → ');
}
function splitText(p){
  const isF = s => /[−×]/.test(s), p100 = x => Math.round(x * 100) + '%';
  if (!isF(p.chosen)){
    const over = p.tried.filter(x => !isF(x.by) && x.top_share >= 0.6);
    if (over.length > 1) return `${over.map(x => `${x.by} ${p100(x.top_share)}`).join('、')}都超过 60%，取更集中的${p.chosen}`;
    return `${p.chosen}里最大一块占 ${p100(p.tried.find(x => x.by === p.chosen).top_share)}，超过 60%，按${p.chosen}拆`;
  }
  const dims = p.tried.filter(x => !isF(x.by)).sort((a, b) => b.top_share - a.top_share);
  return `${dims.length ? `维度里最大一块只占 ${p100(dims[0].top_share)}（${dims[0].by}），不到 60%` : '能拆的维度都已经限定了'}，按公式 ${p.chosen} 拆（${p.method}）`;
}
const TOP_REQUIRED = ['skill', 'schema_version', 'query', 'render_mode', 'status', 'degrade', 'root_metric', 'decomposition', 'primary_path',
  'executive_summary', 'insights', 'root_cause', 'suggestions', 'confidence', 'data_path', 'checks', 'analysis_process'];
async function finishAttr(conv, k, steps, mode){
  const c = D.attribution[k].contract;
  await step(steps, '归因 Skill', '调用拆解工具', async body => {
    if (c.status === 'degraded'){
      body.innerHTML = `<div class="split-line"><b>${esc(Object.values(c.root_metric.filter).join(' · '))} · ${c.root_metric.metric}</b>：${esc(c.degrade.message)}</div>`;
      return {sum: `没有往下拆，返回降级结果（${c.degrade.code}）`, state: 'stop'};
    }
    const pri = new Set(c.primary_path.map(id => nodeById(c, id).label));
    for (const p of c.analysis_process){
      body.insertAdjacentHTML('beforeend', `<div class="split-line ${pri.has(p.node) ? 'pri' : ''}">第 ${p.step} 次 · <b>${esc(p.node)}</b>：${splitText(p)}${pri.has(p.node) ? '<span class="pri-tag">主路径</span>' : ''}</div>`);
      scroll(); await sleep(320);
    }
    const r = c.checks.stop_rules;
    body.insertAdjacentHTML('beforeend', `<div class="split-line" style="color:#999">停止条件：贡献不足总变化的 ${r.min_share * 100}%、两期订单都不到 ${r.min_orders} 单、拆到第 ${r.max_depth} 层</div>`);
    let depth = 0; walk(c.decomposition, n => { if (n.expanded) depth = Math.max(depth, n.depth + 1); });
    return {sum: `拆了 ${c.analysis_process.length} 次、${depth} 层，主路径：${pathShort(c)}`};
  });
  const ck = await step(steps, '结果校验', '检查契约和加总', async () => {
    const missing = TOP_REQUIRED.filter(f => !(f in c)), rows = [];
    rows.push(`<div class="chk ${missing.length ? 'hit' : 'pass'}"><span class="m">${missing.length ? '!' : '✓'}</span>输出契约：${TOP_REQUIRED.length} 个必填字段${missing.length ? '缺 ' + missing.join('、') : '都在'}</div>`);
    if (c.status === 'ok'){
      let n = 0, bad = 0;
      walk(c.decomposition, x => { if (x.expanded && x.children.length){ n++; if (Math.abs(x.children.reduce((a, y) => a + y.contribution_to_parent, 0) - x.change) > 1) bad++; } });
      rows.push(`<div class="chk ${bad ? 'hit' : 'pass'}"><span class="m">${bad ? '!' : '✓'}</span>加总闭合：页面重新加了一遍，${n} 次拆分${bad ? `有 ${bad} 次加不回上一层` : '各项加起来都等于上一层的变化'}</div>`);
    } else rows.push(`<div class="chk ${c.decomposition === null && c.degrade?.message ? 'pass' : 'hit'}"><span class="m">✓</span>降级结果：拆解树为空，写明了原因</div>`);
    if (rows.some(x => x.includes('chk hit'))) return {sum: '没有通过，结果不展示', state: 'stop', body: rows.join(''), fail: true};
    return {sum: c.status === 'ok' ? '契约和加总都通过' : '降级结果符合契约', state: c.status === 'ok' ? 'done' : 'stop', body: rows.join('')};
  });
  if (ck.fail){ addMsg(conv, 'bot', '<div class="msg-text">归因结果没有通过校验，为了不把错的数给出去，这次不展示结果。</div>'); return; }
  conv.attr.push(k);
  addMsg(conv, 'bot', c.status === 'ok' ? attrCard(conv, k, mode) : degradedCard(k, mode));
  done(conv, k);
  if (conv.id === S.active) RENDER.chat(conv.id);
}
function pathHtml(c){
  const u = c.decomposition.unit;
  return `<div class="pp">${c.primary_path.slice(1).map(id => nodeById(c, id)).map((n, i) => {
    const w = Math.min(Math.abs(n.share_of_root ?? 0), 1) * 100;
    return `<div class="pp-item"><div class="pp-no">${i + 1}</div><div><div class="pp-lab"><span class="n">${esc(n.label)}</span><span class="c ${cls(n.contribution_to_root)}">${effect(n.contribution_to_root, u)}</span></div>` +
      `<div class="pp-sub">${val(n.metric, n.unit, n.previous)} → ${val(n.metric, n.unit, n.current)} · ${shareText(n)}</div><div class="bar"><i class="${(n.share_of_root ?? 0) > 1 ? 'over' : ''}" style="width:${w}%"></i></div></div></div>`;
  }).join('')}</div>`;
}
function treeHtml(n, u, parent){
  const factor = parent && parent.split.method === '对数平均法' ? `<span class="t-s">（${esc(parent.metric)}的因子）</span>` : '';
  const head = n.depth === 0
    ? `<span class="t-n pri">${esc(n.label)}</span> <span class="t-v">${val(n.metric, n.unit, n.previous)} → ${val(n.metric, n.unit, n.current)}</span>`
    : `<span class="t-n ${n.is_primary ? 'pri' : ''}">${esc(n.label)}</span>${factor} <span class="t-v">${val(n.metric, n.unit, n.previous)} → ${val(n.metric, n.unit, n.current)}</span>，<span class="t-c ${cls(n.contribution_to_root)}">${effect(n.contribution_to_root, u)}</span>`;
  const how = n.split ? ` <span class="t-s">（往下按${esc(n.split.by)}拆，${n.split.method}）</span>` : n.stop_reason ? ` <span class="t-s">（不再往下拆：${esc(n.stop_reason)}）</span>` : '';
  return `<li>${head}${how}${(n.children || []).length ? `<ul>${n.children.map(x => treeHtml(x, u, n)).join('')}</ul>` : ''}</li>`;
}
const engineTag = mode => `<div class="engine skill" data-act="gotoSkill" data-arg="attribution" title="查看这个 Skill">归因分析 Skill · ${mode} ›</div>`;
function attrCard(conv, k, mode){
  const c = D.attribution[k].contract, r = c.root_metric, root = c.decomposition, u = root.unit;
  const f = Object.values(r.filter).join(' ');
  let h = engineTag(mode) + `<div class="ar-title">归因结果 · ${esc(f)}${r.metric}<span class="conf ${c.confidence.level}">置信度 ${c.confidence.level}</span></div>`;
  h += `<div class="ar-lead">${esc(c.executive_summary)}</div>`;
  h += `<div class="ar-kpi"><div><div class="k">本期 ${rng(r.period.current)}</div><div class="v">${val(r.metric, u, r.current)}</div></div><div><div class="k">对比期 ${rng(r.period.base)}</div><div class="v">${val(r.metric, u, r.previous)}</div></div>` +
       `<div><div class="k">变化</div><div class="v ${r.change < 0 ? 'down' : 'up'}">${r.change > 0 ? '+' : ''}${num(r.change)} ${u}（${r.change_pct === null ? '不适用' : spct(r.change_pct)}）</div></div></div>`;
  h += `<div class="ar-sec">主路径：变化一层层落在哪里</div>${pathHtml(c)}`;
  h += `<span class="fold-btn" data-act="toggleNext">展开完整拆解树 ▾</span><div class="fold-box"><div class="tree"><ul>${treeHtml(root, u)}</ul></div>` +
       `<div class="t-s" style="margin-top:4px">加粗的是主路径。每一项后面写的是它对总变化的影响，同一层各项加起来，等于上一层对总变化的影响。按乘法拆时，下面两项标了"因子"。</div></div>`;
  h += `<div class="ar-sec">哪些已证实，哪些要核查</div>`;
  c.insights.forEach(x => { h += `<div class="ev"><span class="ev-tag ok">${x.evidence}</span><span>${esc(x.text)}</span></div>`; });
  c.root_cause.to_verify.forEach(x => { h += `<div class="ev"><span class="ev-tag tv">待核查</span><span>${esc(x.hypothesis)}需要${esc(x.check)}。</span></div>`; });
  if (c.suggestions.length){ h += `<div class="ar-sec">建议</div>`; c.suggestions.forEach((s, i) => { h += `<div class="sg"><span class="num">${i + 1}</span><span>${esc(s)}</span></div>`; }); }
  const dp = c.data_path;
  h += `<div class="ar-foot"><span>置信度依据：${esc(c.confidence.basis.split('；')[0])}</span><span>数据：${esc(base(dp.file))}（${dp.version}，导出范围 ${rng(dp.declared_range)}）</span></div>`;
  h += `<div class="btns"><button class="btn mq" data-act="openReport" data-arg="${conv.id}|${k}">导出报告</button><button class="btn" data-act="toggleRaw">查看契约 JSON</button></div><pre class="raw">${esc(JSON.stringify(c, null, 1))}</pre>`;
  return h;
}
function degradedCard(k, mode){
  const c = D.attribution[k].contract, r = c.root_metric;
  return engineTag(mode) + `<div class="ar-title">归因结果 · ${esc(Object.values(r.filter).join(' '))}${r.metric}<span class="conf 低">没有给结论</span></div>` +
    `<div class="dg"><div class="dg-t">只说变化了多少，不说原因</div><div class="dg-m">${esc(c.degrade.message)}</div></div>` +
    `<div class="msg-text" style="font-size:13px;color:#555">这个范围太小，拆出来的贡献会被一两笔订单左右。可以把范围放大再问，比如去掉"门店"只看华南的连衣裙。系统不会自己换一个时间段或指标去凑结论。</div>` +
    `<div class="btns"><button class="btn" data-act="toggleRaw">查看契约 JSON</button></div><pre class="raw">${esc(JSON.stringify(c, null, 1))}</pre>`;
}

// ---------- 定时任务：确认卡、试跑、启用（PRD 路线 2） ----------
async function finishSchedule(conv, k, steps, t){
  const sp = D.schedule.spec;
  await step(steps, '生成确认卡', '整理任务说明', async () => ({sum: '统计上周、每周五 09:00 执行，等你确认',
    body: `<div class="xp-line"><span class="k">来自这句话</span>定时：${esc(t.schedule?.raw || '每周五早上 9 点')}；报告：经营周报；时间：上周</div>
      <div class="xp-line"><span class="k">来自模板</span>指标和口径按已确认的经营周报模板填写</div>`}));
  const same = S.tasks.find(x => x.original);
  addMsg(conv, 'bot', `<div class="engine skill" data-act="gotoSkill" data-arg="scheduled-report">定时报告 Skill · ${S.calls[S.calls.length - 1]?.mode || '自动选择'} ›</div>
    <div class="ar-title">确认这个定时任务</div>
    ${(t.problems || []).some(p => p.slot === 'report_scope') ? `<div class="t-s" style="margin:-4px 0 8px">模型问了"${esc(t.problems.find(p => p.slot === 'report_scope').question)}"，在这张卡上一次问完</div>` : ''}
    <div class="cf">
      <div class="cf-row"><span class="k">统计哪几天</span><span>${esc(sp.time_rule)}</span></div>
      <div class="cf-row"><span class="k">看哪些指标</span><span>${sp.analysis.metrics.map(m => `${m.name}：${m.definition}`).join('<br>')}<br><span class="t-s">首版周报固定看这两项</span></span></div>
      <div class="cf-row"><span class="k">按什么分组</span><span>${esc(sp.analysis.group_by)}，突出${esc(sp.analysis.highlight)}<br><span class="t-s">按地区、渠道拆分首版还不支持</span></span></div>
      <div class="cf-row"><span class="k">和哪期比</span><span>${esc(sp.analysis.compare)}</span></div>
      <div class="cf-row"><span class="k">数据从哪来</span><span>订单数据，每次用最新上传的版本；数据没覆盖本期和对比期就不出周报，只发提醒</span></div>
      <div class="cf-row"><span class="k">什么时候执行</span><span>${sp.schedule.weekday} ${sp.schedule.time}（北京时间）</span></div>
      <div class="cf-row"><span class="k">结果放到哪</span><span>定时任务收件箱</span></div>
    </div>
    ${same ? `<div class="notice">已有相同的任务：${esc(same.name)}（每周五 09:00，${same.status === '启用' ? '已启用' : same.status}）。</div>` : ''}
    <div class="btns" data-box="confirm"><button class="btn" data-act="gotoTasks">查看已有任务</button><button class="btn pri" data-act="trialNew" data-arg="${conv.id}">仍然新建并试跑</button><button class="btn" data-act="cancelNew" data-arg="${conv.id}">取消</button></div>`);
  conv.taskState = 'confirm';
  done(conv, k);
}
function lockBox(conv, box){ conv.pane.querySelectorAll(`[data-box="${box}"] .btn`).forEach(b => b.classList.add('dis')); }
async function trialNew(convId){
  const conv = S.convs.find(c => c.id === convId);
  if (S.running || !['confirm', 'trial_failed'].includes(conv.taskState)) return toast('这一步已经处理过了');
  lockBox(conv, conv.taskState === 'confirm' ? 'confirm' : 'trial');
  S.running = true;
  try {
    const cond = S.files.v3.status === '已就绪' ? 'trial_v3' : 'trial_no_v3';
    const v = D.schedule.variants[cond];
    if (!conv.taskId){
      conv.taskId = 'new' + conv.id;
      S.tasks.push({id: conv.taskId, name: '每周经营周报（新建）', status: '待试跑', created_at: '2026-10-12', records: []});
    }
    const task = S.tasks.find(x => x.id === conv.taskId);
    const steps = newPanel(conv, '试跑', ['创建任务', '试跑']);
    await step(steps, '创建任务', '保存任务说明', async () => ({sum: '已保存，状态：待试跑', body: '<div class="xp-line"><span class="k">说明</span>试跑成功、你看过周报之后才能启用</div>'}));
    const res = await step(steps, '试跑', '按今天换算统计期并计算', async () => v.result.status === 'success'
      ? {sum: '成功，统计 10 月 5 日至 11 日，和前一周比'}
      : {sum: '没有生成：数据没覆盖本期和对比期', state: 'stop', body: `<div class="xp-line"><span class="k">原因</span>${esc(v.result.message)}</div>`});
    const inbox = Object.fromEntries(v.new_inbox.map(m => [m.run_id, m]));
    v.new_runs.forEach(r => task.records.unshift({...r, inbox: inbox[r.run_id]}));
    const msg = v.new_inbox[v.new_inbox.length - 1];
    if (v.result.status === 'success'){
      task.status = '待启用'; conv.taskState = 'trial_ok';
      addMsg(conv, 'bot', `<div class="wk-head"><span class="wk-badge">试跑</span>已放进定时任务收件箱</div><div class="md">${mdRender(msg.body.split('## 可以接着问')[0])}</div>
        <div class="btns" data-box="trial"><button class="btn pri" data-act="enableNew" data-arg="${conv.id}">内容和口径没问题，启用</button><button class="btn" data-act="cancelNew" data-arg="${conv.id}">取消</button></div>`);
    } else {
      conv.taskState = 'trial_failed';
      addMsg(conv, 'bot', `<div class="dg"><div class="dg-t">${esc(msg.title)}</div><div class="dg-m">${esc(v.result.message)}</div></div>
        <div class="msg-text" style="font-size:13px">试跑没成功的任务不能启用：${esc(v.result.enable.message)}</div>
        <div class="btns" data-box="trial"><button class="btn pri dis" data-act="hint" data-arg="${esc(v.result.enable.message)}">启用</button>
          <button class="btn" data-act="openUpload">去上传 10 月 5 日至 11 日的数据</button><button class="btn" data-act="trialNew" data-arg="${conv.id}">重新试跑</button></div>`);
    }
  } finally { S.running = false; }
}
function enableNew(convId){
  const conv = S.convs.find(c => c.id === convId);
  if (conv.taskState !== 'trial_ok') return toast('这一步已经处理过了');
  lockBox(conv, 'trial');
  const task = S.tasks.find(x => x.id === conv.taskId);
  task.status = '启用'; conv.taskState = 'enabled'; S.selTask = task.id;
  addMsg(conv, 'bot', `<div class="msg-text">已启用：每周五 09:00 执行，下次是 10 月 16 日。结果会放进定时任务收件箱。</div><div class="btns"><button class="btn" data-act="gotoTasks">查看定时任务</button></div>`);
}
function cancelNew(convId){
  const conv = S.convs.find(c => c.id === convId);
  if (!['confirm', 'trial_ok', 'trial_failed'].includes(conv.taskState)) return toast('这一步已经处理过了');
  lockBox(conv, 'confirm'); lockBox(conv, 'trial');
  if (conv.taskId){ S.tasks = S.tasks.filter(x => x.id !== conv.taskId); if (S.selTask === conv.taskId) S.selTask = S.tasks[0].id; }
  conv.taskState = 'cancelled';
  addMsg(conv, 'bot', '<div class="msg-text">已取消，没有创建任务。</div>');
}

// ---------- 技能、知识库 ----------
function openSkillPicker(btn){
  const opt = (id, name, d) => `<div class="pop-opt ${S.pinned === id ? 'on' : ''}" data-act="pin" data-arg="${id || 'auto'}"><b>${name}</b><span>${d}</span></div>`;
  openPop(btn, `<h4>这一问用哪个 Skill</h4>${opt(null, '自动（推荐）', '系统按意图自动选：问"为什么"交给归因分析，定时报告交给定时报告')}` +
    opt('attribution', '归因分析', '解释指标为什么变了，找出变化落在哪、是哪个因子') +
    opt('scheduled-report', '定时报告', '把经营周报设成定时任务，到点自动生成') +
    `<div class="t-s" style="margin-top:6px">指定只对下一问有效，问完自动恢复。</div>`);
}
function pin(arg){
  closePop();
  S.pinned = arg === 'auto' ? null : arg;
  renderPin();
  toast(S.pinned ? `已指定${SKILL_LABEL[S.pinned]}，只对下一问有效` : '已恢复自动选择');
}
function openKb(btn){
  const items = [['净销售额', '实付金额减退款金额后求和，按支付日期统计'], ['订单数', '订单编号去重计数'], ['客单价', '实付金额 ÷ 订单数'], ['退款率', '退款金额 ÷ 实付金额']];
  openPop(btn, `<h4>已确认的口径</h4>${items.map(([n, d]) => `<div class="pop-kb"><b>${n}</b>：${d}</div>`).join('')}<span class="pop-link" data-nav="metrics">查看指标模型 ›</span>`);
}

/* 点击统一在这里分发。页面上能点的元素只有三种写法：
   data-nav="页面"  去某个页面；data-act="动作"  执行下面 ACT 里的动作；data-off="名称"  提示暂未开放。
   验收程序按这三种属性逐个点，没有第四种，所以不会有点了没反应的元素。 */
const ACT = {
  back,
  toggleGroup: (a, el) => el.classList.toggle('open'),
  agentActive: () => toast('当前就是 DataAgent'),
  hint: msg => toast(msg),
  openUpload: () => { closePop(); closeDrawer(); openUpload(); },
  closeUpload,
  localFile: () => toast('演示版不读本地文件，请从下面的示例文件里选'),
  pickNew: k => { closeUpload(); go('check', k); },
  pickRecent: k => { closeUpload(); go('profile', k); },
  confirmRange: k => { S.files[k].status = '已就绪'; S.files[k].uploaded_at = '2026-10-12 10:20'; S.homeFile = k; toast('已进入数据源，版本 v3'); go('profile', k); },
  reExport: () => { toast('请在后台按需要的时间范围重新导出后再上传'); openUpload(); },
  openProfile: k => { closeUpload(); go('profile', k); },
  openError: k => go('error', k),
  startAsk: () => startAsk(),
  homeData: (a, el) => homeData(el),
  homePick,
  homeAsk: k => homeAsk(k),
  homeSend,
  openConv,
  newTask: () => newTask(),
  ask: k => ask(k),
  send,
  clarifyPick: (a, el) => clarifyPick(el),
  pinResolve,
  openSkillPicker: (a, el) => openSkillPicker(el),
  openKb: (a, el) => openKb(el),
  pin,
  unpin: () => { S.pinned = null; renderPin(); toast('已恢复自动选择'); },
  toggleNext: (a, el) => el.nextElementSibling.classList.toggle('show'),
  toggleRaw: (a, el) => el.parentElement.nextElementSibling.classList.toggle('show'),
  toggleStep: (a, el) => { if (!el.parentElement.classList.contains('run')) el.parentElement.classList.toggle('closed'); },
  foldPanel: (a, el) => { const x = el.closest('.xp'); x.classList.toggle('folded'); el.textContent = x.classList.contains('folded') ? '展开' : '收起'; },
  reportFromToolbar: (a, el) => el.classList.contains('dis') ? toast('这个对话还没有归因结果，先问一个"为什么"的问题') : go('report', S.active),
  openReport: id => go('report', id),
  downloadMd: k => downloadText(`归因报告_${Object.values(D.attribution[k].contract.root_metric.filter).join('')}.md`, D.attribution[k].report),
  print: () => window.print(),
  gotoSkill: id => go('skills', id),
  skillDoc: id => openDrawer(`SKILL.md · ${SKILL_INFO[id].name}`, `<div class="md">${mdRender(D.skills[id].replace(/^---[\s\S]*?---\n/, ''))}</div>`),
  closeDrawer,
  selectTask: (id, el, e) => { if (e.target.closest('.btn')) return; S.selTask = id; RENDER.tasks(); },
  openRecord,
  runNow,
  toggleTask,
  gotoTasks: () => go('tasks'),
  trialNew,
  enableNew,
  cancelNew,
};

document.addEventListener('click', e => {
  const pop = $('#pop');
  if (pop.classList.contains('show') && !pop.contains(e.target) && !e.target.closest('[data-act="openSkillPicker"],[data-act="openKb"],[data-act="homeData"]')) closePop();
  if (e.target.id === 'uploadModal') return closeUpload();
  const off = e.target.closest('[data-off]');
  if (off) return toast('演示版暂未开放：' + off.dataset.off);
  const nav = e.target.closest('[data-nav]');
  if (nav){ closeUpload(); closeDrawer(); closePop(); go(nav.dataset.nav); return; }
  const a = e.target.closest('[data-act]');
  if (!a) return;
  const fn = ACT[a.dataset.act];
  if (fn) fn(a.dataset.arg, a, e);
  else toast('这个动作还没接上：' + a.dataset.act);
});
$('#askInput').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); send(); } });
$('#homeInput').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); homeSend(); } });
$('#askInput').addEventListener('input', e => { e.target.style.height = 'auto'; e.target.style.height = Math.min(e.target.scrollHeight, 120) + 'px'; });
$('#convSearch').addEventListener('input', renderConvList);
document.addEventListener('keydown', e => { if (e.key === 'Escape'){ closeUpload(); closeDrawer(); closePop(); } });

initTasks();
initWeekly();
go('home');
window.__APP = {S, ACT, Q, D};   // 给验收程序用

})();
