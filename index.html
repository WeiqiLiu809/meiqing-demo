<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>美擎 DataAgent · 文件问数</title>
<style>

/* ========== Reset & Base ========== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --primary:#1677ff;--primary-light:#e8f4fd;--primary-hover:#4096ff;
  --bg:#f0f2f5;--white:#fff;--border:#e8e8e8;--border-light:#f0f0f0;
  --text-primary:#1a1a1a;--text-secondary:#666;--text-tertiary:#999;--text-quaternary:#bbb;
  --success:#52c41a;--warning:#faad14;--error:#ff4d4f;--info:#1677ff;
  --sidebar-width:200px;--mid-width:300px;--header-h:48px;
  --radius:6px;--radius-sm:4px;--shadow:0 2px 8px rgba(0,0,0,.06);
  --shadow-lg:0 6px 24px rgba(0,0,0,.10);--font:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
  --red-up:#cf1322;--green-down:#389e0d;
}
html,body{height:100%;font-family:var(--font);font-size:14px;color:var(--text-primary);background:var(--bg);overflow:hidden}
a{color:var(--primary);text-decoration:none;cursor:pointer}
a:hover{color:var(--primary-hover)}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:#ccc;border-radius:3px}
::-webkit-scrollbar-track{background:transparent}

/* ========== Header ========== */
.header{position:fixed;top:0;left:0;right:0;z-index:100;height:var(--header-h);background:var(--white);border-bottom:1px solid var(--border-light);display:flex;align-items:center;padding:0 16px;gap:12px}
.header-logo{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;flex-shrink:0}
.header-logo svg{width:22px;height:22px}
.header-back{display:none;align-items:center;justify-content:center;width:32px;height:32px;border-radius:var(--radius-sm);cursor:pointer;color:var(--text-secondary);background:transparent;border:1px solid transparent;margin-right:4px;flex-shrink:0;transition:all .15s}
.header-back:hover{background:var(--bg);color:var(--text-primary)}
.header-back.show{display:flex}
.header-back svg{width:18px;height:18px}
.header-spacer{flex:1}
.header-right{display:flex;align-items:center;gap:16px;font-size:13px;color:var(--text-secondary)}
.header-right .lang-btn{display:flex;align-items:center;gap:4px;padding:4px 10px;border-radius:var(--radius-sm);cursor:pointer}
.header-right .lang-btn:hover{background:var(--bg)}
.header-right .icon-btn{width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:var(--radius-sm);cursor:pointer;color:var(--text-secondary)}
.header-right .icon-btn:hover{background:var(--bg);color:var(--text-primary)}
.header-user{display:flex;align-items:center;gap:4px;cursor:pointer;font-size:13px}

/* ========== Main Layout ========== */
.main{display:flex;height:calc(100vh - var(--header-h));margin-top:var(--header-h)}

/* ========== Sidebar ========== */
.sidebar{width:var(--sidebar-width);background:var(--white);border-right:1px solid var(--border-light);overflow-y:auto;flex-shrink:0;display:flex;flex-direction:column}
.sidebar-inner{padding:8px 0}
.nav-group{margin-bottom:2px}
.nav-group-title{display:flex;align-items:center;justify-content:space-between;padding:8px 16px 8px 20px;font-size:13px;color:var(--text-secondary);cursor:pointer;user-select:none}
.nav-group-title:hover{color:var(--text-primary)}
.nav-group-title svg{width:12px;height:12px;transition:transform .2s}
.nav-group-title.open svg{transform:rotate(180deg)}
.nav-item{display:flex;align-items:center;gap:8px;padding:8px 20px 8px 28px;font-size:13px;color:var(--text-secondary);cursor:pointer;transition:all .15s;user-select:none}
.nav-item:hover{color:var(--primary);background:#f5f7fa}
.nav-item.active{color:var(--primary);background:var(--primary-light);font-weight:500;border-right:3px solid var(--primary)}
.nav-item svg{width:16px;height:16px;flex-shrink:0;opacity:.75}
.nav-item.active svg{opacity:1}

/* ========== Middle Panel ========== */
.mid-panel{width:var(--mid-width);background:var(--white);border-right:1px solid var(--border-light);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden}
.mid-header{padding:16px 16px 12px;border-bottom:1px solid var(--border-light)}
.mid-header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.mid-header-top h2{font-size:16px;font-weight:600}
.mid-header-top .fs-btn{width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:var(--radius-sm);cursor:pointer;color:var(--text-secondary)}
.mid-header-top .fs-btn:hover{background:var(--bg);color:var(--text-primary)}
.new-chat-btn{display:flex;align-items:center;gap:6px;color:var(--primary);font-size:13px;cursor:pointer;padding:6px 0;width:fit-content}
.new-chat-btn:hover{color:var(--primary-hover)}
.new-chat-btn svg{width:14px;height:14px}
.section-label{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;margin-bottom:8px;color:var(--text-primary)}
.section-label svg{width:14px;height:14px}
.agent-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.agent-chip{display:flex;align-items:center;gap:7px;padding:6px 10px;border-radius:var(--radius-sm);background:var(--white);border:1px solid var(--border-light);cursor:pointer;transition:all .15s;min-width:0}
.agent-chip:hover{border-color:var(--primary);background:var(--primary-light)}
.agent-chip.active{border-color:var(--primary);background:#e8f4fd;color:var(--primary)}
.agent-avatar{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:#fff;flex-shrink:0}
.agent-avatar.blue{background:var(--primary)}
.agent-avatar.orange{background:#fa8c16}
.agent-avatar.purple{background:#722ed1}
.agent-name{font-size:12.5px;color:var(--text-primary);white-space:nowrap}
.search-box{position:relative;margin-bottom:12px}
.search-box input{width:100%;padding:6px 30px 6px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:13px;outline:none;background:var(--bg)}
.search-box input:focus{border-color:var(--primary);box-shadow:0 0 0 2px rgba(22,119,255,.1)}
.search-box svg{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--text-tertiary)}
.mid-body{flex:1;overflow-y:auto;padding:0 12px}
.conv-item{padding:10px 12px;border-radius:var(--radius-sm);cursor:pointer;margin-bottom:2px;transition:background .1s}
.conv-item:hover{background:var(--bg)}
.conv-item.active{background:var(--primary-light)}
.conv-item-title{font-size:13px;color:var(--text-primary);margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.conv-item-sub{font-size:12px;color:var(--text-tertiary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.conv-item-tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:3px;background:var(--primary-light);color:var(--primary);margin-right:4px}
.pagination{display:flex;align-items:center;justify-content:center;gap:6px;padding:12px 0 16px;font-size:12px;color:var(--text-secondary)}
.pagination span{cursor:pointer;padding:2px 6px;border-radius:3px}
.pagination span:hover,.pagination span.cur{background:var(--bg);color:var(--primary)}

/* ========== Right Panel (Main Workspace) ========== */
.workspace{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative;background:var(--bg)}

/* --- Welcome / Upload Screen --- */
.screen{display:none;flex:1;flex-direction:column;overflow-y:auto;padding:0}
.screen.active{display:flex}
.welcome-area{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 60px}
.welcome-title{font-size:26px;font-weight:700;margin-bottom:8px}
.welcome-title span{background:linear-gradient(135deg,#1677ff,#69b1ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.welcome-sub{font-size:14px;color:var(--text-secondary);margin-bottom:36px}
.suggest-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:680px;width:100%;margin-bottom:20px}
.suggest-card{padding:16px 18px;background:var(--white);border:1px solid var(--border-light);border-radius:var(--radius);cursor:pointer;transition:all .2s;font-size:13.5px;color:var(--text-primary);line-height:1.5}
.suggest-card:hover{border-color:var(--primary);box-shadow:0 2px 12px rgba(22,119,255,.12);transform:translateY(-1px)}
.refresh-suggestions{font-size:13px;color:var(--text-secondary);cursor:pointer;display:flex;align-items:center;gap:4px;margin-bottom:36px}
.refresh-suggestions:hover{color:var(--primary)}

/* Upload Zone */
.upload-zone{max-width:520px;width:100%}
.upload-drag{border:2px dashed #c0c8d4;border-radius:12px;padding:48px 32px;text-align:center;background:var(--white);cursor:pointer;transition:all .25s;position:relative}
.upload-drag:hover,.upload-drag.drag-over{border-color:var(--primary);background:rgba(22,119,255,.02)}
.upload-drag svg{width:48px;height:48px;color:var(--text-tertiary);margin-bottom:16px}
.upload-drag h3{font-size:16px;color:var(--text-primary);margin-bottom:6px}
.upload-drag p{font-size:13px;color:var(--text-tertiary);margin-bottom:18px}
.upload-btns{display:flex;gap:10px;justify-content:center}
.upload-btns button{padding:7px 20px;border-radius:var(--radius-sm);font-size:13px;cursor:pointer;border:1px solid var(--border);background:var(--white);transition:all .15s}
.upload-btns button.primary{background:var(--primary);color:var(--white);border-color:var(--primary)}
.upload-btns button.primary:hover{background:var(--primary-hover)}
.upload-btns button:hover{border-color:var(--primary);color:var(--primary)}
.upload-formats{margin-top:16px;font-size:12px;color:var(--text-tertiary)}
.upload-formats span{display:inline-block;padding:2px 8px;background:var(--bg);border-radius:3px;margin:0 3px}
.recent-files{margin-top:24px}
.recent-files h4{font-size:13px;font-weight:500;margin-bottom:10px;color:var(--text-secondary)}
.file-row{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:var(--radius-sm);cursor:pointer;transition:background .1s}
.file-row:hover{background:var(--bg)}
.file-icon{width:32px;height:32px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;flex-shrink:0}
.file-icon.xlsx{background:#207245}.file-icon.csv{background:#1677ff}.file-icon.txt{background:#faad14}
.file-info{flex:1;min-width:0}
.file-name{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-meta{font-size:11.5px;color:var(--text-tertiary);margin-top:1px}

/* Bottom Input Bar */
.input-bar{padding:16px 24px 20px;background:var(--white);border-top:1px solid var(--border-light)}
.dataset-tag{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;background:#f6ffed;border:1px solid #b7eb8f;border-radius:var(--radius-sm);font-size:12px;color:#389e0d;margin-bottom:10px}
.dataset-tag .rm{cursor:pointer;font-size:14px;line-height:1;color:var(--text-tertiary);margin-left:2px}
.input-wrap{display:flex;align-items:flex-end;gap:10px;background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:8px 12px;transition:border-color .2s;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.input-wrap:focus-within{border-color:var(--primary);box-shadow:0 0 0 2px rgba(22,119,255,.1)}
textarea.input-field{flex:1;border:none;outline:none;resize:none;font-size:14px;line-height:1.6;font-family:var(--font);max-height:120px;min-height:24px;background:transparent}
textarea.input-field::placeholder{color:var(--text-quaternary)}
.input-actions{display:flex;align-items:center;gap:6px;flex-shrink:0}
.input-actions svg{width:20px;height:20px;color:var(--text-tertiary);cursor:pointer;padding:2px;border-radius:4px}
.input-actions svg:hover{color:var(--primary);background:var(--bg)}
.send-btn{width:34px;height:34px;border-radius:50%;background:var(--primary);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s}
.send-btn:hover{background:var(--primary-hover)}
.send-btn:disabled{background:#d9d9d9;cursor:not-allowed}
.send-btn svg{width:17px;height:17px;color:#fff}

/* --- Loading Screen --- */
.loading-screen{align-items:center;justify-content:center}
.loading-card{width:480px;background:var(--white);border-radius:12px;box-shadow:var(--shadow-lg);padding:40px;text-align:center}
.loading-icon{width:56px;height:56px;margin:0 auto 20px;animation:spin 1.2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-title{font-size:17px;font-weight:600;margin-bottom:8px}
.loading-desc{font-size:13px;color:var(--text-secondary);margin-bottom:28px}
.steps{display:flex;justify-content:center;gap:0}
.step{text-align:center;position:relative;padding:0 16px}
.step:not(:last-child)::after{content:'';position:absolute;top:11px;right:-8px;width:16px;height:2px;background:#e8e8e8}
.step.done::after{background:var(--primary)}
.step-dot{width:22px;height:22px;border-radius:50%;border:2px solid #e8e8e8;display:flex;align-items:center;justify-content:center;margin:0 auto 8px;font-size:11px;color:#fff;font-weight:600;transition:all .3s}
.step.done .step-dot,.step.active .step-dot{border-color:var(--primary);background:var(--primary)}
.step.active .step-dot{animation:pulse 1.5s infinite}
.step-label{font-size:12px;color:var(--text-tertiary);white-space:nowrap}
.step.done .step-label,.step.active .step-label{color:var(--text-primary);font-weight:500}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(22,119,255,.3)}50%{box-shadow:0 0 0 8px rgba(22,119,255,0)}}

/* --- Profile Screen --- */
.profile-scroll{padding:28px 40px;overflow-y:auto}
.profile-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
.profile-head h2{font-size:20px;font-weight:600}
.profile-badges{display:flex;gap:8px}
.badge{font-size:12px;padding:3px 10px;border-radius:10px;font-weight:500}
.badge.success{background:#f6ffed;color:#389e0d;border:1px solid #b7eb8f}
.badge.warning{background:#fffbe6;color:#d46b08;border:1px solid #ffe58f}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:28px}
.stat-card{background:var(--white);border-radius:var(--radius);padding:18px 20px;border:1px solid var(--border-light)}
.stat-val{font-size:28px;font-weight:700;margin-bottom:4px}
.stat-val.red{color:var(--red-up)}.stat-val.green{color:var(--green-down)}.stat-val.blue{color:var(--primary)}
.stat-label{font-size:13px;color:var(--text-secondary)}
.stat-trend{font-size:12px;margin-top:4px}
.stat-trend.up{color:var(--red-up)}.stat-trend.down{color:var(--green-down)}
.fields-section h3{font-size:16px;font-weight:600;margin-bottom:16px}
.field-table{background:var(--white);border-radius:var(--radius);border:1px solid var(--border-light);overflow:hidden}
.field-row{display:grid;grid-template-columns:180px 100px 120px 80px 70px 1fr;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border-light);font-size:13px}
.field-row.head{background:#fafafa;font-weight:500;color:var(--text-secondary);font-size:12.5px}
.field-row:last-child{border-bottom:none}
.field-name{font-weight:500;color:var(--text-primary);display:flex;align-items:center;gap:6px}
.type-badge{font-size:11.5px;padding:2px 8px;border-radius:3px;font-weight:500;display:inline-block;text-align:center;min-width:52px}
.type-string{background:#e6f7ff;color:#0958d9}.type-number{background:#f6ffed;color:#389e0d}.type-date{background:#fff7e6;color:#d46b08}
.semantic-tag{font-size:11.5px;padding:1px 7px;border-radius:3px;background:#f0f5ff;color:#1677ff}
.missing-bar{display:flex;align-items:center;gap:6px}
.missing-track{width:60px;height:6px;background:#f0f0f0;border-radius:3px;overflow:hidden}
.missing-fill{height:100%;border-radius:3px;background:var(--warning)}
.missing-pct{font-size:12px;color:var(--text-secondary)}
.example-cell{color:var(--text-tertiary);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:160px}

/* --- Chat/Analysis Screen --- */
.chat-container{display:flex;flex-direction:column;flex:1;overflow:hidden}
.chat-messages{flex:1;overflow-y:auto;padding:24px 32px;scroll-behavior:smooth}
.chat-messages::-webkit-scrollbar{width:6px}
.chat-messages::-webkit-scrollbar-thumb{background:#d9d9d9;border-radius:3px}
.chat-messages::-webkit-scrollbar-thumb:hover{background:#bfbfbf}
.msg{display:flex;gap:12px;margin-bottom:24px;animation:fadeInUp .3s ease}
@keyframes fadeInUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.msg-avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;flex-shrink:0;color:#fff}
.msg-avatar.user{background:#87e8de;color:#006d75}
.msg-avatar.bot{background:var(--primary)}
.msg-body{flex:1;min-width:0}
.msg-author{font-size:12px;color:var(--text-tertiary);margin-bottom:4px}
.msg-bubble{background:var(--white);border-radius:var(--radius);padding:14px 18px;border:1px solid var(--border-light);font-size:14px;line-height:1.7;box-shadow:0 1px 2px rgba(0,0,0,.03);transition:box-shadow .15s}
.msg-bubble:hover{box-shadow:0 2px 6px rgba(0,0,0,.06)}
.msg.user .msg-bubble{background:var(--primary);color:#fff;border-color:var(--primary);box-shadow:0 2px 6px rgba(22,119,255,.2)}
.msg.user .msg-bubble:hover{box-shadow:0 3px 8px rgba(22,119,255,.28)}
.msg-text{word-break:break-word}
/* Chart in bubble */
.chart-area{margin-top:14px;background:var(--white);border:1px solid var(--border-light);border-radius:var(--radius);padding:16px}
.chart-title{font-size:14px;font-weight:600;margin-bottom:12px}
.chart-svg{width:100%;height:220px}
.sql-toggle{margin-top:10px;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--primary);cursor:pointer;width:fit-content;padding:4px 8px;border-radius:4px}
.sql-toggle:hover{background:var(--primary-light)}
.sql-block{margin-top:8px;background:#1a1a2e;border-radius:var(--radius-sm);padding:12px 14px;font-family:'Cascadia Code','Fira Code',Consolas,monospace;font-size:12.5px;color:#a6e22e;overflow-x:auto;line-height:1.6;white-space:pre;display:none}
.sql-block.show{display:block}
/* Parsing trace inline */
.parsing-trace .msg-bubble{padding:14px 18px}
.parsing-bubble{background:#f6ffed !important;border-color:#b7eb8f !important}
.trace-line{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-secondary);margin-bottom:6px;line-height:1.5}
.trace-line:last-child{margin-bottom:0}
.trace-line.done{color:#389e0d;font-weight:500}
.trace-line.active{color:var(--text-primary);font-weight:500}
.trace-dot{width:7px;height:7px;border-radius:50%;background:#b7eb8f;flex-shrink:0}
.trace-line.done .trace-dot{background:#52c41a}
.trace-line.active .trace-dot{background:var(--primary)}
.trace-dot.spin{animation:dotPulse 1s infinite}
@keyframes dotPulse{0%{opacity:1}50%{opacity:.4}100%{opacity:1}}

/* Result card */
.result-bubble{padding:16px 18px !important}
.result-card-title{font-size:16px;font-weight:600;margin-bottom:12px;color:var(--text-primary)}
.result-tabs{display:flex;gap:4px;margin-bottom:12px;border-bottom:1px solid var(--border-light);padding-bottom:8px}
.result-tab{display:flex;align-items:center;gap:5px;padding:6px 12px;border-radius:var(--radius-sm);font-size:13px;color:var(--text-secondary);cursor:pointer;transition:all .15s;background:transparent;border:1px solid transparent}
.result-tab:hover{background:var(--bg);color:var(--text-primary)}
.result-tab.active{background:var(--primary-light);color:var(--primary);border-color:#91caff;font-weight:500}
.result-toolbar{display:flex;flex-wrap:wrap;gap:16px;align-items:center;margin-bottom:12px;font-size:12.5px}
.result-toolbar-label{color:var(--text-secondary)}
.result-groupby,.result-metrics{display:flex;align-items:center;gap:6px}
.result-tag{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;background:#e8f4fd;color:var(--primary);border:1px solid #91caff;border-radius:var(--radius-sm);font-size:12px}
.result-tag.blue{background:#e6f7ff;color:#096dd9;border-color:#69c0ff}
.result-tag-close{cursor:pointer;color:var(--text-tertiary);font-size:14px;line-height:1}
.result-tag-close:hover{color:var(--error)}
.result-tag-add{padding:2px 8px;color:var(--text-secondary);background:var(--bg);border-radius:var(--radius-sm);font-size:12px;cursor:pointer}
.result-tag-add:hover{background:var(--primary-light);color:var(--primary)}
.result-view{display:none}
.result-view.active{display:block}
.result-table{width:100%;border-collapse:collapse;font-size:12.5px;margin-bottom:8px}
.result-table th{background:#f5f5f5;color:var(--text-secondary);font-weight:500;text-align:left;padding:8px 10px;border-bottom:1px solid var(--border-light);white-space:nowrap}
.result-table td{padding:8px 10px;border-bottom:1px solid var(--border-light);color:var(--text-primary)}
.result-table tr:hover td{background:#fafafa}
.result-table th:not(:last-child),.result-table td:not(:last-child){border-right:1px solid var(--border-light)}

.check-card,.range-card{width:520px;max-width:92%;margin:60px auto;background:#fff;border-radius:12px;padding:28px 32px;box-shadow:var(--shadow)}
.check-card h3,.range-card h3{font-size:16px;margin:0 0 4px}
.chk-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed #f0f0f0;font-size:13px}
.chk-item .dot{width:20px;height:20px;border-radius:50%;background:#f0f0f0;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0}
.chk-item.run .dot{background:var(--primary);animation:dotPulse 1s infinite}
.chk-item.ok .dot{background:#52c41a}
.chk-item.bad .dot{background:#ff4d4f}
.chk-item .res{margin-left:auto;color:#888;font-size:12px;text-align:right}
.chk-item.bad .res{color:#cf1322}
.range-big{font-size:20px;font-weight:600;margin:14px 0 6px;color:#222}

/* 数据画像 */
.profile-alert{margin:0 0 16px;padding:10px 14px;border-radius:8px;font-size:13px;line-height:1.7}
.profile-alert.err{background:#fff1f0;border:1px solid #ffa39e;color:#a8071a}
.profile-alert.info{background:#f5faff;border:1px solid #bae0ff;color:#333}
.type-number{background:#e6f4ff;color:#0958d9}
.type-date{background:#f9f0ff;color:#531dab}
.sample-table{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}
.sample-table th,.sample-table td{border:1px solid #f0f0f0;padding:6px 8px;text-align:left;white-space:nowrap}
.sample-table th{background:#fafafa;color:#666;font-weight:500}
.profile-actions{display:flex;align-items:center;gap:10px;margin:18px 0 6px}

/* 对话页 */
.pin-row{display:none;margin:0 0 8px}
.pin-row.show{display:flex}
.pin-chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:3px 10px;border-radius:12px;background:#f0f7ff;border:1px solid #91caff;color:#0958d9}
.pin-chip .x{cursor:pointer;color:#888;font-size:14px}
.suggest-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 10px}
.suggest-row:empty{display:none}
.suggest-row .t-s{font-size:12.5px;color:#888}
.ask-chip{padding:5px 11px;border:1px solid #91caff;border-radius:14px;font-size:12.5px;cursor:pointer;background:#f0f7ff;color:var(--primary);transition:.15s}
.ask-chip:hover{background:var(--primary-light)}
.wk-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:12px;color:#888}
.wk-badge{background:#fff7e6;color:#d46b08;border:1px solid #ffd591;border-radius:4px;padding:0 6px;font-size:11.5px}
.ask-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.sec-t{font-size:13px;font-weight:600;color:var(--mq-dark);margin:14px 0 8px}

/* 执行过程 */
.xp{padding:12px 16px !important;background:#fbfdff !important;border-color:#d6e8ff !important}
.xp-head{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:#333;margin-bottom:8px}
.xp-head .xp-flow{font-weight:400;font-size:12px;color:#999}
.xp-head .xp-fold{margin-left:auto;font-weight:400;font-size:12px;color:var(--primary);cursor:pointer}
.xp.folded .xp-steps{display:none}
.xp-step{position:relative;padding:0 0 10px 22px}
.xp-step:before{content:"";position:absolute;left:6px;top:16px;bottom:-2px;width:1px;background:#e6e6e6}
.xp-step:last-child:before{display:none}
.xp-ico{position:absolute;left:0;top:3px;width:13px;height:13px;border-radius:50%;background:#e6e6e6;border:2px solid #fff;box-shadow:0 0 0 1px #d9d9d9}
.xp-step.run .xp-ico{background:var(--primary);box-shadow:0 0 0 1px var(--primary);animation:dotPulse 1s infinite}
.xp-step.done .xp-ico{background:#52c41a;box-shadow:0 0 0 1px #52c41a}
.xp-step.ask .xp-ico{background:#faad14;box-shadow:0 0 0 1px #faad14}
.xp-step.stop .xp-ico{background:#ff7a45;box-shadow:0 0 0 1px #ff7a45}
.xp-row{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;font-size:13px;line-height:1.6;cursor:pointer}
.xp-name{font-weight:600;color:#222;min-width:64px}
.xp-sum{color:#444}
.xp-step.run .xp-sum{color:#999}
.xp-more{margin-left:auto;font-size:11.5px;color:var(--primary);white-space:nowrap}
.xp-more:after{content:" ▴"}
.xp-step.run .xp-more{display:none}
.xp-step.closed .xp-body{display:none}
.xp-step.closed .xp-more:after{content:" ▾"}
.xp-tag{font-size:11px;padding:0 6px;border-radius:3px;border:1px solid;color:#389e0d;background:#f6ffed;border-color:#b7eb8f}
.xp-tag.draft{color:#d46b08;background:#fff7e6;border-color:#ffd591}
.xp-body{margin-top:5px;font-size:12.5px;color:#555;line-height:1.75}
.xp-line{display:flex;gap:6px}
.xp-line .k{color:#999;flex-shrink:0}
.xp-mini{border-collapse:collapse;font-size:12px;margin:3px 0}
.xp-mini td{padding:3px 10px 3px 0;vertical-align:top;border-bottom:1px dashed #eee}
.xp-mini td:first-child{color:#999;white-space:nowrap}
.src{font-size:11px;padding:0 5px;border-radius:3px;background:#f0f0f0;color:#666;white-space:nowrap}
.src.current{background:#e6f4ff;color:#0958d9}
.src.inherited{background:#f9f0ff;color:#531dab}
.src.derived{background:#fff7e6;color:#ad4e00}
.src.user{background:#f6ffed;color:#389e0d}
.chk{display:flex;gap:6px;font-size:12px;line-height:1.7}
.chk .m{width:14px;flex-shrink:0;text-align:center;font-weight:700}
.chk.pass .m{color:#52c41a}
.chk.hit .m{color:#fa8c16}
.chk.skip{color:#bbb}
.chk.hit{color:#ad4e00;font-weight:500}
.route{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0}
.route span{font-size:11.5px;padding:1px 8px;border-radius:10px;border:1px solid #e6e6e6;color:#999}
.route span.on{border-color:var(--primary);color:var(--primary);background:#f0f7ff;font-weight:600}
.split-line{font-size:12px;line-height:1.7;color:#555;animation:fadeInUp .25s ease}
.split-line b{color:#222;font-weight:600}
.split-line.pri b{color:var(--mq-dark)}
.pri-tag{font-size:10.5px;color:var(--mq-dark);border:1px solid #91caff;border-radius:3px;padding:0 4px;margin-left:4px}
.raw-toggle{display:inline-block;margin-top:4px;font-size:12px;color:var(--primary);cursor:pointer}
.raw{display:none;margin-top:6px;max-height:260px;overflow:auto;background:#1f2329;color:#d4d4d4;font:11.5px/1.55 Menlo,Consolas,monospace;padding:10px 12px;border-radius:6px;white-space:pre}
.raw.show{display:block}

/* 结果卡 */
.engine{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;padding:1px 8px;border-radius:10px;margin-bottom:8px;border:1px solid #d9d9d9;color:#666;background:#fafafa}
.engine.skill{border-color:#91caff;color:#0958d9;background:#f0f7ff;cursor:pointer}
.engine.skill:hover{background:#e6f4ff}
.ar-title{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;margin-bottom:10px}
.ar-title .conf{margin-left:auto;font-size:12px;font-weight:500;padding:1px 10px;border-radius:12px;border:1px solid}
.conf.高{color:#389e0d;background:#f6ffed;border-color:#b7eb8f}
.conf.中{color:#d46b08;background:#fff7e6;border-color:#ffd591}
.conf.低{color:#cf1322;background:#fff1f0;border-color:#ffa39e}
.ar-lead{font-size:13.5px;line-height:1.8;background:#f3f9fd;border-left:3px solid var(--mq);padding:10px 14px;border-radius:0 6px 6px 0;margin-bottom:12px}
.ar-kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.ar-kpi>div{background:#f7f9fc;border:1px solid #eef0f3;border-radius:8px;padding:10px 12px}
.ar-kpi .k{font-size:12px;color:#888}
.ar-kpi .v{font-size:18px;font-weight:600;margin-top:2px}
.ar-kpi .v.down{color:var(--down)}
.ar-kpi .v.up{color:var(--up)}
.ar-sec{font-size:13px;font-weight:600;color:var(--mq-dark);margin:14px 0 8px}
.pp{display:flex;flex-direction:column;gap:9px}
.pp-item{display:grid;grid-template-columns:18px 1fr;gap:8px}
.pp-no{width:18px;height:18px;border-radius:50%;background:var(--mq);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;margin-top:2px}
.pp-lab{display:flex;justify-content:space-between;gap:10px;font-size:13px}
.pp-lab .n{font-weight:500}
.pp-lab .c{color:var(--down);white-space:nowrap}
.pp-lab .c.pos{color:var(--up)}
.pp-lab .c.zero{color:#999}
.pp-sub{font-size:12px;color:#888;margin:1px 0 4px}
.bar{height:7px;background:#eef1f5;border-radius:4px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--mq);border-radius:4px}
.bar>i.over{background:linear-gradient(90deg,var(--mq),#0a6fb0)}
.tree{font-size:12.5px;line-height:1.75;margin-top:4px}
.tree ul{list-style:none;margin:0 0 0 16px;padding:0;border-left:1px dashed #e0e0e0}
.tree>ul{margin-left:0;border-left:none}
.tree li{padding-left:10px}
.tree .t-n{color:#333}
.tree .t-n.pri{font-weight:600;color:var(--mq-dark)}
.tree .t-v{color:#888}
.tree .t-c{color:var(--down)}
.tree .t-c.pos{color:var(--up)}
.tree .t-c.zero{color:#999}
.fold-btn{display:inline-block;font-size:12.5px;color:var(--primary);cursor:pointer;margin-top:4px}
.fold-box{display:none}
.fold-box.show{display:block}
.ev{display:flex;gap:8px;font-size:13px;line-height:1.7;margin-bottom:5px}
.ev-tag{flex-shrink:0;font-size:11px;padding:0 6px;border-radius:3px;border:1px solid;height:19px;line-height:17px;margin-top:2px}
.ev-tag.ok{color:#389e0d;background:#f6ffed;border-color:#b7eb8f}
.ev-tag.tv{color:#d46b08;background:#fff7e6;border-color:#ffd591}
.sg{display:flex;gap:8px;font-size:13px;line-height:1.7;margin-bottom:4px}
.sg .num{color:var(--mq-dark);font-weight:600}
.ar-foot{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:#888;border-top:1px dashed #eee;padding-top:10px;margin-top:14px}
.dg{background:#fffbe6;border:1px solid #ffe58f;border-radius:8px;padding:12px 14px;margin-bottom:10px}
.dg-t{font-size:13.5px;font-weight:600;color:#ad4e00;margin-bottom:4px}
.dg-m{font-size:13px;line-height:1.8;color:#333}
.qt{width:100%;border-collapse:collapse;font-size:12.5px;margin:4px 0 10px}
.qt th,.qt td{padding:7px 10px;border-bottom:1px solid #f0f0f0;text-align:right}
.qt th:first-child,.qt td:first-child{text-align:left}
.qt th{background:#fafafa;color:#666;font-weight:500}
.qt tr.top td{font-weight:600}
.qt .down{color:var(--down)}
.qt .up{color:var(--up)}
.hbar{display:grid;grid-template-columns:56px 1fr 90px;align-items:center;gap:8px;font-size:12.5px;margin:6px 0}
.hbar .b{height:14px;background:#eef1f5;border-radius:3px;overflow:hidden}
.hbar .b i{display:block;height:100%;background:var(--primary);border-radius:3px}
.hbar .v{text-align:right;color:#555}
.cl-opt{padding:6px 14px;border:1px solid #ffd591;border-radius:4px;font-size:13px;cursor:pointer;background:#fff;transition:.15s}
.cl-opt:hover{border-color:#fa8c16;color:#d46b08}
.cl-opt.selected{background:#fff7e6;border-color:#fa8c16;color:#d46b08;font-weight:500}
.cl-opt.dis{cursor:default;opacity:.55}
.cf{border:1px solid #d6e8ff;border-radius:8px;overflow:hidden;margin-top:6px}
.cf-row{display:grid;grid-template-columns:96px 1fr;gap:10px;padding:8px 12px;font-size:13px;border-bottom:1px solid #f0f5ff}
.cf-row:last-child{border-bottom:none}
.cf-row .k{color:#888}
.notice{margin-top:10px;padding:8px 12px;border-radius:6px;background:#fffbe6;border:1px solid #ffe58f;font-size:12.5px;color:#ad4e00}

/* 报告页 */
#scr-report{background:#eef1f5;padding:20px 24px}
.rp-bar{display:flex;align-items:center;gap:8px;max-width:780px;width:100%;margin:0 auto 14px}
.rp-bar .tag-t{font-size:12px;color:#888;margin-right:auto}
.rp-page{max-width:780px;width:100%;margin:0 auto;background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:32px 38px 28px;line-height:1.6}
.rp-page h1{font-size:20px;font-weight:600;display:flex;align-items:center;gap:10px}
.rp-page h1:before{content:"";width:10px;height:10px;border-radius:3px;background:var(--mq)}
.rp-sub{font-size:13px;color:#6b7280;margin:6px 0 20px}
.rp-chips{display:flex;flex-wrap:wrap;gap:8px}
.rp-chip{font-size:12.5px;padding:3px 12px;border-radius:14px;border:1px solid}
.rp-chip.r{background:#FCEBEB;color:#A32D2D;border-color:#F09595}
.rp-chip.g{background:#EAF3DE;color:#3B6D11;border-color:#97C459}
.rp-root{background:#f7f9fc;border-radius:10px;padding:12px 14px;font-size:13.5px}

/* 定时任务、Skills、指标模型、数据源 */
.pg{padding:22px 28px 40px;width:100%;max-width:1100px}
.pg-head{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.pg-head h2{font-size:18px;margin:0}
.pg-head .sub{font-size:12.5px;color:#888}
.pg-head .right{margin-left:auto;display:flex;gap:8px}
.card{background:#fff;border:1px solid #eef0f3;border-radius:10px;padding:14px 16px;margin-bottom:14px}
.card.sel{border-color:#91caff;box-shadow:0 0 0 2px #e6f4ff}
.card h3{font-size:14.5px;margin:0 0 6px;display:flex;align-items:center;gap:8px}
.card .meta{font-size:12.5px;color:#666;line-height:1.8}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px;background:#fff}
.tbl th,.tbl td{padding:8px 10px;border-bottom:1px solid #f0f0f0;text-align:left;vertical-align:top}
.tbl th{background:#fafafa;color:#666;font-weight:500}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:#f7fbff}
.tasks-grid{display:grid;grid-template-columns:320px 1fr;gap:16px;align-items:start}
.skill-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.calls{margin-top:8px;font-size:12px;color:#555;line-height:1.8}
@media print{
  body *{visibility:hidden}
  #scr-report .rp-page,#scr-report .rp-page *{visibility:visible}
  #scr-report .rp-page{position:absolute;left:0;top:0;border:none;max-width:none;padding:0}
  html,body,.main,.workspace,#scr-report{overflow:visible !important;height:auto !important;display:block !important}
}

/* 排版修正：截图检查后补的 */
.drawer{box-shadow:none;visibility:hidden}
.drawer.show{box-shadow:-8px 0 30px rgba(0,0,0,.12);visibility:visible}
.field-table .field-row{grid-template-columns:150px 90px 120px 120px 80px 1fr;column-gap:12px}
.stat-val.date{font-size:22px;line-height:1.3}
.profile-actions{margin:18px 0 22px}
.btn{white-space:nowrap}
.rp-bar{flex-wrap:wrap}
.tasks-grid{grid-template-columns:1fr}
.task-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.task-cards .card{margin-bottom:0}
.tbl td.nw,.tbl th.nw{white-space:nowrap}

/* 首页底部输入框（PRD P1） */
.home-scroll{flex:1;overflow-y:auto}
.home-data{margin:0 0 8px}
.home-tag{cursor:pointer;margin:0}
.home-tag.empty{background:#fafafa;color:#888;border-color:#d9d9d9}
.home-tag:hover{border-color:var(--primary)}
.pop-opt.dim b{color:#999}

.file-row.warn-row{background:#fffbe6}
.file-row.warn-row:hover{background:#fff4cc}

</style>
</head>

t\": \"2026-09-21\", \"declared_end\": \"2026-10-04\"},\n \"render_mode\": \"chat_tree\"\n}\n```\n\ndimensions 是允许拆的维度，只能填文件里有的列。render_mode 告诉前端怎么展示：chat_tree 是对话里的归因树，report 是导出的报告。\n\n## 怎么调用\n\n```text\npython3 attribution.py --input inputs/A_外套_周报追问.json --out result.json\npython3 render_report.py --result result.json\n```\n\nattribution.py 只算，输出 JSON；render_report.py 相当于前端，把 JSON 渲染成报告。指标的拆解公式、哪些维度能拆、停止条件、待核查的原因假设，都写在 metric_model.json 里，换场景改这份文件，不改程序。\n\n## 怎么拆\n\n- 每一层先找变化集中在哪一块：按某个维度切开后，变动最大的一块占各块变动绝对值之和的 60% 以上，就按这个维度拆；几个维度都过线，取占比最高的；都没过线，再按公式拆因子。\n- 加法公式（净销售额 = 实付金额 − 退款金额）按差值拆。乘法公式（实付金额 = 订单数 × 客单价，退款金额 = 实付金额 × 退款率）用对数平均法拆，各项贡献加起来正好等于总变化。\n- 不能相加的组合不拆：订单数不按商品品类拆，因为一笔订单可能跨多个品类；客单价、退款率是比值，不按维度拆。\n- 停止条件：贡献不足总变化的 3% 不展开；两期订单都不到 20 单不展开；最多拆 3 层。\n- 算不对就不用：一种拆法的各项贡献加不回上一层的变化，这种拆法不采用，写进 checks.rejected_splits，换别的拆法。\n\n## 返回结果怎么处理\n\n按 status 处理：\n\n- ok：\n  - 先说 executive_summary，再按 render_mode 展示。chat_tree 展示 decomposition 里 is_primary 为 true 的那条主路径，其他分支可以展开看；report 用 render_report.py 生成完整报告。\n  - confidence 为中或低时，说结论要带上限定，比如\"主要来自……，但只解释了一部分变化\"。\n  - checks.rejected_splits 不为空时，提醒用户数据可能有问题，比如同一笔订单记到了不同地区。\n  - insights 里的内容标\"已证实\"，可以直接说。root_cause.to_verify 里的内容是猜测，必须说成\"可能是……，需要核对……\"，不能说成已经确定的原因。\n  - 用户接着问某个分支，比如\"门店为什么反而涨了\"，用这个分支的范围作为 filters 再调用一次。\n- degraded：把 degrade.message 告诉用户，它写明了为什么没有分析。不要换一个有数据的时间段或换一个指标自己凑结果。\n  - not_ready：数据没覆盖本期和对比期，提示上传新文件。\n  - missing_columns：文件缺列，提示缺哪一列。\n  - unsupported_metric：指标首版不支持。\n  - no_change：两期没有变化。\n  - no_data：范围内没有数据，可能是 filters 写错了。\n  - too_few_orders：这个范围两期订单都不到 20 单，拆出来的贡献不可靠。告诉用户变化了多少，建议放大范围再问。\n  - no_split：这个范围拆不下去，比如维度都已经限定了、乘法公式里有值为 0。告诉用户变化了多少，以及为什么没往下拆。\n\n## 规则\n\n- 数字只来自程序计算，模型只写说明文字，不改数、不补数。\n- 拆解只能说明变化发生在哪里、是哪个因子；为什么发生，数据里看不出来的，一律标待核查。\n- 同一个问题问两次，结果必须一样。\n- 输出必须符合 attribution_result.schema.json，失败时也要输出，不允许空白回复。\n", "scheduled-report": "---\nname: scheduled-report\ndescription: 把用户确认过的数据分析任务按约定时间自动执行，结果放进 Agent 收件箱。用户说\"每周五给我发周报\"\"每天早上把昨天的数据发给我\"\"把这个查询设成每周一自动跑\"时使用。\n---\n\n# 自动化任务 Skill\n\n## 什么时候用\n\n意图识别的输出出现下面两种情况之一时使用：\n\n- 一句话里带了定时要求，schedule 不为空。比如\"每周五早上 9 点把上周的经营周报发给我\"，意图识别判为 L5 报告，附带定时要求\"每周五 09:00\"。\n- 只要求定时，判为 EXIT（schedule_only）。比如用户问完\"8 月华东各品类的净销售额\"，接着说\"把这个查询设成每周一早上自动跑\"，任务内容沿用上一轮。\n\n不用的情况：用户只问一次数，没有定时要求；用户要求推到企微群或邮件，首版不支持，如实告诉用户结果会放在 Agent 收件箱。\n\n## 创建前先确认\n\n执行时没有人可以问，所以创建前用一张确认卡把要问的一次问完：\n\n- 统计哪几天。比如\"上周一到上周日\"，还是\"本周一到周四\"。\n- 包含哪些指标，各自按什么口径算。口径只能用已确认的说明，没有就问用户。\n- 数据从哪来。绑定哪个数据源，这次上传的文件导出了哪几天，以后多久上传一次新版本。\n- 什么时候执行。比如每周五 09:00，北京时间。\n\n用户确认后才调用 create，接着马上试跑。试跑成功生成周报、用户看过之后才能启用。\n\n首版只支持一种固定的经营周报：净销售额（sum(实付金额-退款金额)）和订单数（nunique(订单编号)），按商品品类拆开，统计上周，和前一周比。用户要的口径或维度不在这个范围里，create 会返回 unsupported，如实告诉用户首版做不了，不要换成相近的口径凑合。\n\n## 输入：任务说明\n\n确认卡确认后的内容存成一个 JSON，示例见 [task_spec.json](task_spec.json)。和作业一意图识别输出的对应关系：\n\n- query_object 写进 analysis.metrics，带上口径、口径来源，以及程序能读懂的公式 formula；\n- baseline 写进 analysis.compare（给人看，比如\"和前一周比\"）和 analysis.compare_key（给程序读，首版只有 previous_week）；\n- group_by 写进 analysis.group_by；\n- time_range 里的\"上周\"写进 time_rule（给人看）和 time_key（给程序读，首版只有 last_week），存相对说法，不存具体日期；\n- schedule 写进 schedule。\n\n另外再补三项作业一里没有的：data_source（从哪个数据源取数）、readiness（什么情况下算数据准备好了）、delivery（结果放到哪里）。\n\n## 怎么调用\n\n```text\npython3 scheduled_task.py create   --spec task_spec.json --now 2026-09-28T10:00\npython3 scheduled_task.py upload   --source orders --file 订单_0921-1004.csv --start 2026-09-21 --end 2026-10-04 --now 2026-10-12T10:00\npython3 scheduled_task.py trial    --task <task_id> --now 2026-09-28T10:05\npython3 scheduled_task.py enable   --task <task_id>\npython3 scheduled_task.py pause    --task <task_id>\npython3 scheduled_task.py resume   --task <task_id>\npython3 scheduled_task.py run-now  --task <task_id> --now 2026-10-12T10:05\npython3 scheduled_task.py backfill --run <run_id> --now 2026-10-12T10:00\npython3 scheduled_task.py tick     --now 2026-10-09T09:00\n```\n\nupload 的 --start 和 --end 是用户确认的导出范围。tick 由调度器每分钟调用一次，检查有没有到点的任务；原型里用 --now 指定时间来模拟。\n\n## 返回结果怎么处理\n\n每个命令都返回一个 JSON，按 status 处理：\n\n- created：告诉用户任务已创建，接着试跑。\n- unsupported：任务说明不在首版支持范围内。创建时返回的，任务没有建出来；执行时返回的，说明任务被改过，这次没有计算。把 message 告诉用户。\n- success（试跑）：把收件箱里那份标了【试跑】的周报给用户看，问内容和口径对不对。用户说对，再调用 enable。\n- success（到点执行、立即运行、补跑）：周报已经在收件箱里，不用额外处理。\n- not_ready：把 message 原样告诉用户，它写明了数据覆盖到哪天、这期需要到哪天。提示上传新文件后补跑。不要自己换一个有数据的统计期。\n- missing_columns：告诉用户新文件缺哪一列。不要拿别的列代替。\n- error：程序已经自动重试过一次，把失败的环节告诉用户。\n- skipped：任务没启用或已暂停，到点没有执行，不用处理。\n- rejected：这个操作当前不允许，把原因告诉用户。比如试跑还没成功就要启用。\n- already_handled：这个任务在这个执行时刻已经处理过，重复触发直接跳过，不用处理。\n\n到点执行后返回的 task_status 是\"暂停\"，说明连续 3 次到点都没出周报，任务已自动暂停。提醒用户检查数据源，处理好后调用 resume。\n\n## 规则\n\n- 执行时不重新理解口径，计算按任务说明里的公式来，公式要在程序里登记过。要改指标或口径，编辑任务后重新试跑。\n- 同一个任务在同一个执行时刻只处理一次。\n- 补跑漏掉的一期用 backfill，沿用那一期原来的统计期；要看新的一期用 run-now，按当天换算。\n- 执行过程中不向用户提问。\n- 周报里的数字只来自程序计算，模型只写说明文字。\n- 连续失败只按到点执行计数，同一次执行里的自动重试不重复计数，补跑和立即运行不计入，成功一次就清零。\n"}, "intent": {"A": {"real": true, "output": {"tasks": [{"id": "t1", "intent": "L3", "exit_type": null, "raw_text": "外套的净销售额为什么比前一周少了 25.6%？", "intent_confidence": 0.95, "candidates": [], "slots": {"query_object": {"raw": "净销售额", "value": "净销售额", "columns": ["实付金额", "退款金额"], "definition": "实付金额减退款金额后求和", "definition_source": "已确认口径", "source": "current"}, "time_range": {"raw": "前一周", "start": "2026-09-28", "end": "2026-10-04", "column": "支付日期", "source": "inherited"}, "time_granularity": null, "filters": [{"raw": "外套", "value": "外套", "column": "商品品类", "source": "current"}], "group_by": [], "result_form": null, "sort_limit": null, "baseline": {"raw": "比前一周", "type": "上期", "start": "2026-09-21", "end": "2026-09-27", "source": "inherited"}, "forecast_horizon": null, "report_scope": null}, "schedule": null, "depends_on": [], "problems": []}], "unhandled": []}}, "W2": {"real": true, "output": {"tasks": [{"id": "t1", "intent": "L2", "exit_type": null, "raw_text": "哪个品类的退款金额变化最大？", "intent_confidence": 0.9, "candidates": [{"intent": "L1", "confidence": 0.2}], "slots": {"query_object": {"raw": "退款金额", "value": "退款金额", "columns": ["退款金额"], "definition": null, "definition_source": null, "source": <script>
(function(){
/* 状态、导航和通用工具。对应 PRD 第三节（页面）、第七节（每个能点的地方）。 */
const D = window.APP_DATA;
const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms * (window.__SPEED || 1)));   // 验收程序会调快动画

const num = v => Math.round(v).toLocaleString('en-US');

const spct = x => (x > 0 ? '+' : '') + pct(x);
const md2 = d => { const [, m, dd] = d.split('-'); return `${+m}/${+dd}`; };
const rng = r => `${md2(r[0])}–${md2(r[1])}`;
const cn = d => { const [, m, dd] = d.split('-'); return `${+m} 月 ${+dd} 日`; };
const cnr = r => `${cn(r[0])}至 ${cn(r[1])}`;
const base = f => String(f || '').split('/').pop();
const TODAY = D.today;

// ---------- 状态 ----------
const S = {
  screen: null, arg: null, history: [],
  files: JSON.parse(JSON.stringify(D.files)),
  tried: [],                 // 上传过但没通过校验的文件
  convs: [], active: null, seq: 0,
  pinned: null, running: false, pendingRoute: null,
  tasks: [], selTask: null, ran: {},
  calls: [],                 // Skill 调用记录
  homeFile: null,            // 首页输入框当前选中的数据
};

function uploaded(){
  return ['v1', 'v2', 'v3'].filter(k => S.files[k].status === '已就绪')
    .map(k => ({key: k, version: S.files[k].version, file: S.files[k].name, range: [S.files[k].date_start, S.files[k].date_end]}));
}

// ---------- 页面切换 ----------
const RENDER = {};
const TRANSIENT = new Set(['check']);   // 校验是过渡页，不进返回栈
const NAV_OF = {home: 'home', check: 'home', range: 'home', profile: 'home', chat: 'home', report: 'home', error: 'home',
  tasks: 'tasks', skills: 'skills', metrics: 'metrics', sources: 'sources'};

function go(screen, arg){
  if (!TRANSIENT.has(screen)){
    const top = S.history[S.history.length - 1];
    if (!top || top.screen !== screen || top.arg !== arg) S.history.push({screen, arg});
  }
  show(screen, arg);
}
function back(){
  if (S.history.length < 2) return;
  S.history.pop();
  const t = S.history[S.history.length - 1];
  show(t.screen, t.arg);
}
function show(screen, arg){
  S.screen = screen; S.arg = arg;
  document.querySelectorAll('.workspace > .screen').forEach(x => x.classList.toggle('active', x.id === 'scr-' + screen));

  RENDER[screen](arg);
  document.querySelectorAll('.sidebar [data-nav]').forEach(x => x.classList.toggle('active', x.dataset.nav === NAV_OF[screen]));
  $('#headerBack').classList.toggle('show', S.history.length > 1);
  renderConvList();
  renderBadge();
}

let toastTimer;

}
function openPop(anchor, html){
  const p = $('#pop');

  const r = anchor.getBoundingClientRect();

  $('#convList').innerHTML = list.length

        `<div class="conv-item-title">${esc(c.title)}${c.unread ? '<span class="unread"></span>' : ''}</div><div class="conv-item-sub">${esc(c.sub)}</div></div>`).join('')

}

  const n = S.convs.filter(c => c.type === 'weekly' && c.unread).length;
  const b = $('#taskBadge');
  b.textContent = n; b.classList.toggle('show', n > 0);

// ---------- Markdown ----------
function mdRender(src){
  const lines = src.split('\n'); let h = '', list = null, table = [], code = null;
  const inl = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/`([^`]+)`/g, '<code>$1</code>');

  };
  const closeList = () => { if (list){ h += `</${list}>`; list = null; } };
  for (const l of lines){
    if (code !== null){ if (l.startsWith('```')){ h += `<pre><code>${esc(code)}</code></pre>`; code = null; } else code += l + '\n'; continue; }
    if (l.startsWith('```')){ closeList(); flushT(); code = ''; continue; }
    if (l.startsWith('|')){ closeList(); table.push(l.trim()); continue; } else flushT();
    const ul = l.match(/^\s*- (.*)/), ol = l.match(/^\s*\d+\. (.*)/);
    if (ul || ol){
      const t = ul ? 'ul' : 'ol';
      if (list !== t){ closeList(); h += `<${t}>`; list = t; }
      h += `<li>${inl((ul || ol)[1])}</li>`; continue;
    }
    closeList();
    if (l.startsWith('### ')) h += `<h3>${inl(l.slice(4))}</h3>`;
    else if (l.startsWith('## ')) h += `<h2>${inl(l.slice(3))}</h2>`;
    else if (l.startsWith('# ')) h += `<h1>${inl(l.slice(2))}</h1>`;
    else if (l.startsWith('> ')) h += `<blockquote>${inl(l.slice(2))}</blockquote>`;
    else if (l.trim()) h += `<p>${inl(l)}</p>`;
  }
  closeList(); flushT();
  return h;
}
function rawToggle(label, obj){
  const text = typeof obj === 'string' ? obj : JSON.stringify(obj, null, 1);
  return `<span class="raw-toggle" data-act="toggleNext">${label} ▾</span><pre class="raw">${esc(text)}</pre>`;
}
function downloadText(name, text){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type: 'text/markdown;charset=utf-8'}));
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

const CHECKS = {
  v3: [['格式', 'CSV', true], ['大小', '', true], ['编码', 'UTF-8', true], ['列名', '7 列，必需的列都在', true]],
  bad_col: [['格式', 'CSV', true], ['大小', '', true], ['编码', 'UTF-8', true], ['列名', '缺少：退款金额', false]],
  bad_encoding: [['格式', 'CSV', true], ['大小', '', true], ['编码', '读出来是乱码，不是 UTF-8 或 GBK', false]],
  too_big: [['格式', 'Excel', true], ['大小', '128 MB，超过 50 MB 的上限', false]],
};
RENDER.check = async key => {
  const f = S.files[key];
  const items = CHECKS[key].map(([n, r, ok]) => [n, n === '大小' && ok ? `${sizeText(f.size_kb)}，未超过 50 MB` : r, ok]);
  const all = ['格式', '大小', '编码', '列名'];
  $('#scr-check').innerHTML = `<div class="check-card"><h3>正在校验 ${esc(f.name)}</h3><div class="t-s">上传时只做轻量校验，完整解析放到第一次提问时</div>
    ${all.map(n => `<div class="chk-item" data-n="${n}"><span class="dot"></span>${n}<span class="res">等待</span></div>`).join('')}</div>`;
  const token = Symbol(); S.checkToken = token;
  for (const [n, r, ok] of items){
    const el = $(`#scr-check [data-n="${n}"]`);
    el.className = 'chk-item run'; el.querySelector('.res').textContent = '检查中…';
    await sleep(550);
    if (S.checkToken !== token) return;
    el.className = 'chk-item ' + (ok ? 'ok' : 'bad');
    el.querySelector('.dot').textContent = ok ? '✓' : '!';
    el.querySelector('.res').textContent = r;
    if (!ok) break;
  }
  await sleep(700);
  if (S.checkToken !== token) return;
  if (key === 'v3') return go('range', 'v3');
  if (!S.tried.includes(key)) S.tried.push(key);
  S.files[key].status = '校验未通过';
  S.files[key].uploaded_at = '2026-10-12 10:18';
  go(key === 'bad_col' ? 'profile' : 'error', key);
};

function openRecord(arg){

function runNow(id){
  const cond = S.files.v3.status === '已就绪' ? 'run_now_v3' : 'run_now_no_v3';
  if (S.ran[cond]) return toast('刚运行过，结果在执行记录第一条');

  const inbox = Object.fromEntries(v.new_inbox.map(m => [m.run_id, m]));
  const t = S.tasks.find(x => x.id === id);
  v.new_runs.forEach(r => t.records.unshift({...r, inbox: inbox[r.run_id]}));

// ---------- P6 报告 ----------
// arg 是"对话|结果"：结果卡上的导出报告带着自己的结果；顶部"生成报告"只带对话，用最近一次归因结果
RENDER.report = arg => {
  const [convId, own] = arg.split('|');
  const conv = S.convs.find(c => c.id === convId);
  const k = own || conv.attr[conv.attr.length - 1];
  const A = D.attribution[k], c = A.contract, r = c.root_metric, root = c.decomposition;
  const f = Object.entries(r.filter).map(([a, b]) => `${a} ${b}`).join('，') || '全部';
  let h = `<div class="rp-bar"><span class="tag-t">由归因分析 Skill 的结果生成，和对话里的归因卡片读的是同一份结果</span>
    <button class="btn" data-act="back">返回对话</button><button class="btn" data-act="downloadMd" data-arg="${k}">下载 Markdown</button>
    <button class="btn" data-off="导出 Excel">导出 Excel</button><button class="btn" data-off="生成分享链接">生成分享链接</button>
    <button class="btn mq" data-act="print">导出 PDF</button></div><div class="rp-page">`;
  h += `<h1>数据归因报告</h1><div class="rp-sub">指标 · ${r.metric} ｜ 范围 · ${esc(f)} ｜ 本期 ${cnr(r.period.current)}，对比 ${cnr(r.period.base)}</div>`;
  if (c.status !== 'ok'){
    h += `<div class="dg"><div class="dg-t">没有完成分析</div><div class="dg-m">${esc(c.degrade.message)}</div></div>`;
  } else {
    const u = root.unit;
    h += `<div class="ar-lead">${esc(c.executive_summary)}</div>`;
    h += `<div class="ar-kpi"><div><div class="k">本期</div><div class="v">${val(r.metric, u, r.current)}</div></div><div><div class="k">对比期</div><div class="v">${val(r.metric, u, r.previous)}</div></div><div><div class="k">变化</div><div class="v ${r.change < 0 ? 'down' : 'up'}">${r.change_pct === null ? '不适用' : spct(r.change_pct)}</div></div></div>`;
    h += `<div class="ar-sec">主路径</div>${pathHtml(c)}`;
    if (root.split && root.split.type === 'dimension'){
      h += `<div class="ar-sec">按${esc(root.split.by)}看</div><div class="rp-chips">${root.children.map(x => `<span class="rp-chip ${x.contribution_to_root < 0 ? 'r' : 'g'}">${esc(Object.values(x.filter).filter(v => !Object.values(r.filter).includes(v)).join(' '))} ${effect(x.contribution_to_root, u)}</span>`).join('')}</div>`;
    }
    h += `<div class="ar-sec">根因</div><div class="rp-root"><b>已证实：</b>${esc(c.root_cause.confirmed)}<br>${c.root_cause.to_verify.map(x => `<b>待核查：</b>${esc(x.hypothesis)}需要${esc(x.check)}。`).join('<br>')}</div>`;
    h += `<div class="ar-sec">建议</div>${c.suggestions.map((s, i) => `<div class="sg"><span class="num">${i + 1}</span><span>${esc(s)}</span></div>`).join('')}`;
    let depth = 0; walk(root, n => { if (n.expanded) depth = Math.max(depth, n.depth + 1); });
    h += `<div class="ar-foot"><span>置信度：${c.confidence.level}</span><span>数据：${esc(base(c.data_path.file))}（${c.data_path.version}）</span><span>拆了 ${depth} 层，调用拆解 ${c.analysis_process.length} 次</span></div>`;
  }
  $('#scr-report').innerHTML = h + '</div>';
};

function available(conv){
  if (S.running || conv.pending) return [];
  return Object.keys(Q).filter(k => {
    const x = Q[k];
    if (x.conv !== conv.type || conv.asked.includes(k)) return false;
    if (x.first) return conv.asked.length === 0;
    if (x.after) return x.after.includes(conv.asked[conv.asked.length - 1]);
    return true;
  });
}
// 每一问预先算好的结果对应的条件，路由时拿来和这次识别出的槽位比
function expected(k){
  const A = D.attribution[k];
  if (A) return {metric: A.input.metric, filters: A.input.filters, cur: A.input.period.current, base: A.input.period.base};
  const q = D.queries[k];
  if (q) return {metric: q.metric, filters: q.filter || {}, cur: q.period, base: q.base || null};
  return null;
}

const norm = s => s.replace(/[\s？?。.,，！!：:]/g, '');
function send(){
  const ta = $('#askInput');
  const text = ta.value.trim();
  if (!text) return toast('先输入问题，或点"可以问"里的问题');
  const c = activeConv();
  if (S.running) return toast('上一问还在执行');
  ta.value = '';
  if (c.pending){
    addMsg(c, 'user', esc(text));
    addMsg(c, 'bot', '<div class="msg-text">先回答上面的问题，点一个选项就行。</div>');
    return;
  }
  const k = available(c).find(x => norm(Q[x].q) === norm(text));
  if (k) return ask(k, text);
  addMsg(c, 'user', esc(text));
  const ks = available(c);
  addMsg(c, 'bot', ks.length
    ? `<div class="msg-text">这句话演示版还接不住，现在可以问：</div><div class="ask-row">${ks.map(x => `<span class="ask-chip" data-act="ask" data-arg="${x}">${esc(Q[x].q)}</span>`).join('')}</div>`
    : `<div class="msg-text">这个对话里预置的问题都问完了。可以点"新建"开一个新对话，或者去定时任务看看。</div>`);
}

    if (afterChecks(conv, k, t2, s2, ck.r)) await finish(conv, k, t2, s2, steps);
  } finally { S.running = false; renderSuggest(); }
}
function confirmUser(conv, items){

// ---------- 提问 ----------
async function ask(k, typed){
  const conv = activeConv();
  if (S.running) return toast('上一问还在执行');
  if (!available(conv).includes(k)) return toast('这个问题现在不能问，看看"可以问"里的');
  const x = Q[k];
  if (conv.asked.length === 0 && conv.type === 'ask'){ conv.title = x.q; renderConvList(); }
  S.running = true; renderSuggest();
  addMsg(conv, 'user', esc(typed || x.q));
  try {
    const steps = newPanel(conv, '执行过程', [...(conv.file && !conv.parsed ? ['完整解析文件'] : []), '意图判定', '槽位提取', '澄清判断', '路由', ...EXEC[x.kind]]);
    if (conv.file && !conv.parsed) await step(steps, '完整解析文件', '第一次提问，解析文件', async () => parseStep(conv));
    let t, slots;
    await step(steps, '意图判定', '读取意图识别结果', async () => { const r = intentStep(k); t = r.t; slots = t.slots; return r; });
    await step(steps, '槽位提取', '整理槽位和来源', async () => {
      const miss = missingOf(slots, t.intent);
      return {sum: miss.length ? `缺${miss.map(m => SLOT_NAME[m]).join('、')}` : slotLine(slots), body: slotRows(slots, t.intent)};
    });
    const ck = await step(steps, '澄清判断', '程序按顺序检查', async () => checkResult(runChecks(t, slots, k)));
    if (afterChecks(conv, k, t, slots, ck.r)) await finish(conv, k, t, slots, steps);
  } finally { S.running = false; renderSuggest(); }
}

// ---------- 路由及之后 ----------
function targetOf(t){
  if (t.intent === 'L3') return {id: 'attribution', label: '归因分析 Skill'};
  if (t.intent === 'L5' && t.schedule) return {id: 'scheduled-report', label: '定时报告 Skill'};
  if (t.intent === 'L2') return {id: null, label: '对比查询'};
  return {id: null, label: '查询引擎'};
}
function compareInput(slots, e){
  if (!e) return [];
  const out = [], r2 = (a, b) => a && b ? rng([a, b]) : '空';
  if (slots.query_object && slots.query_object.value !== e.metric) out.push({name: '指标', got: slots.query_object.value, want: e.metric});
  if (slots.time_range?.start !== e.cur[0] || slots.time_range?.end !== e.cur[1]) out.push({name: '本期', got: r2(slots.time_range?.start, slots.time_range?.end), want: rng(e.cur)});
  if (e.base && (slots.baseline?.start !== e.base[0] || slots.baseline?.end !== e.base[1])) out.push({name: '对比期', got: r2(slots.baseline?.start, slots.baseline?.end), want: rng(e.base)});
  const f = {}; (slots.filters || []).forEach(x => f[x.column] = x.value);
  const fs = o => Object.entries(o).map(([a, b]) => `${a}=${b}`).join('，') || '无';
  const same = Object.keys(f).length === Object.keys(e.filters).length && Object.keys(f).every(c => e.filters[c] === f[c]);
  if (!same) out.push({name: '筛选', got: fs(f), want: fs(e.filters)});
  return out;
}
function routeBody(k, t, slots, target, mode, mism){
  const R = [['L1', '查询引擎'], ['L2', '对比查询'], ['L3', '归因分析 Skill'], ['L4', '预测'], ['L5', t.schedule ? '定时报告 Skill' : '报告']];
  let h = `<div class="route">${R.map(([l, e]) => `<span class="${l === t.intent ? 'on' : ''}">${l} ${INTENT_NAME[l]} → ${e}</span>`).join('')}</div>`;
  h += `<div class="xp-line"><span class="k">方式</span>${mode}</div>`;
  const cov = coverVersion(slots);
  if (cov) h += `<div class="xp-line"><span class="k">选数据</span>本期${slots.baseline?.start ? '和对比期合起来' : ''}是 ${rng([cov.lo, cov.hi])}，要找导出范围能盖住它的版本：${cov.all.map(v => `${v.version}（${rng(v.range)}）${v.range[0] <= cov.lo && v.range[1] >= cov.hi ? '✓' : '✗'}`).join('；')}。用 ${cov.pick ? cov.pick.version : '无'}</div>`;
  else if (t.schedule) h += `<div class="xp-line"><span class="k">选数据</span>定时任务每次执行时用订单数据最新上传的版本，不在这里绑定</div>`;
  if (mism.length) h += `<div class="xp-line" style="color:#cf1322"><span class="k">对不上</span>${mism.map(m => `${m.name}：这次是 ${esc(m.got)}，预先算好的是 ${esc(m.want)}`).join('；')}</div>`;
  const A = D.attribution[k];
  if (A){ const shown = JSON.parse(JSON.stringify(A.input)); shown.data.file = base(shown.data.file); h += rawToggle('查看调用入参', shown); }
  return h;
}
async function finish(conv, k, t, slots, steps){
  const x = Q[k], target = targetOf(t), pinned = S.pinned;
  const mism = x.kind === 'schedule' ? [] : compareInput(slots, expected(k));
  if (pinned && pinned !== target.id){
    const why = target.id ? `系统判断这一问要交给${target.label}` : `这一问是${t.intent === 'L2' ? '对比' : '查数'}，没有要解释的变化，系统判断走${target.label}`;
    await step(steps, '路由', '按意图选执行器', async () => ({sum: `你指定了${SKILL_LABEL[pinned]}，但${why}`, state: 'ask', body: routeBody(k, t, slots, target, `你指定了${SKILL_LABEL[pinned]}`, [])}));
    S.pendingRoute = {conv, k, t, slots};
    conv.pending = {route: true};
    addMsg(conv, 'bot', `<div class="msg-text">你指定了${SKILL_LABEL[pinned]}，但${why}。要怎么处理？</div>` +
      `<div class="btns"><button class="btn pri" data-act="pinResolve" data-arg="system">按系统判断处理（${target.label}）</button><button class="btn" data-act="pinResolve" data-arg="cancel">取消指定</button></div>`);
    return;
  }
  const mode = pinned ? '按你指定的' : '自动选择';

  await continueRoute(conv, k, t, slots, steps, target, mode, mism);
}
async function continueRoute(conv, k, t, slots, steps, target, mode, mism){
  const x = Q[k];
  const cov = coverVersion(slots);
  await step(steps, '路由', '按意图选执行器', async () => mism.length
    ? {sum: `${target.label}（${mode}），但条件和预先算好的结果对不上，停在这里`, state: 'stop', body: routeBody(k, t, slots, target, mode, mism)}
    : {sum: `${t.intent} ${INTENT_NAME[t.intent]} → ${target.label}（${mode}）${cov?.pick ? `，用 ${cov.pick.version} 数据` : ''}`, body: routeBody(k, t, slots, target, mode, mism)});
  if (mism.length){
    addMsg(conv, 'bot', `<div class="msg-text">这次识别出的${mism.map(m => m.name).join('、')}和演示版预先算好的结果不一样。演示版没有这个条件下的结果，所以不往下执行，也不拿别的结果顶上。</div>`);
    return;
  }
  if (target.id) S.calls.push({skill: target.id, conv: conv.title, q: x.q, mode});
  if (x.kind === 'query' || x.kind === 'compare') return finishQuery(conv, k, steps);
  if (x.kind === 'attr') return finishAttr(conv, k, steps, mode);

}
async function pinResolve(arg){

    await continueRoute(p.conv, p.k, p.t, p.slots, steps, target, '按系统判断（你指定的不适用）', compareInput(p.slots, expected(p.k)));

}
function done(conv, k){ conv.asked.push(k); renderSuggest(); }

// ---------- 查数、对比 ----------
// 校验用当场要展示的数字重新算，不读预先存好的校验结论
function verifyQuery(q){
  const rows = [];
  const line = (ok, text) => rows.push(`<div class="chk ${ok ? 'pass' : 'hit'}"><span class="m">${ok ? '✓' : '!'}</span>${text}</div>`);
  if (q.kind === 'query'){
    const s = q.rows.reduce((a, r) => a + r.value, 0);
    line(Math.abs(s - q.total) < 0.5, `各行重新加一遍是 ${num(s)} ${q.unit}，合计是 ${num(q.total)} ${q.unit}`);
    const off = q.rows.filter(r => Math.abs(r.share - r.value / q.total) > 0.0005);
    line(!off.length, `每行的占比 = 这一行 ÷ 合计：${off.length ? `${off.map(r => r.name).join('、')}对不上` : `${q.rows.length} 行都对得上`}`);
  } else {
    const bad = q.rows.filter(r => Math.abs(r.current - r.previous - r.change) > 0.5);
    line(!bad.length, `每行的变化 = 本期 − 前一周：${bad.length ? `${bad.map(r => r.name).join('、')}对不上` : `${q.rows.length} 行都对得上`}`);
    if (q.total){
      const sum = f => q.rows.reduce((a, r) => a + r[f], 0);
      const cur = sum('current'), prev = sum('previous'), chg = sum('change');
      line(Math.abs(cur - q.total.current) < 0.5, `各行本期加起来是 ${num(cur)} ${q.unit}，本期合计是 ${num(q.total.current)} ${q.unit}`);
      line(Math.abs(prev - q.total.previous) < 0.5, `各行前一周加起来是 ${num(prev)} ${q.unit}，前一周合计是 ${num(q.total.previous)} ${q.unit}`);
      line(Math.abs(chg - q.total.change) < 0.5 && Math.abs(q.total.current - q.total.previous - q.total.change) < 0.5,
        `各行变化加起来是 ${num(chg)} ${q.unit}，合计的变化是 ${num(q.total.change)} ${q.unit}`);
    }
  }
  const ok = !rows.some(x => x.includes('chk hit'));
  return {ok, rows: rows.join(''), sum: q.kind === 'query' ? `各行加起来等于合计（${num(q.total)} ${q.unit}）` : '每行变化和合计都核对通过'};
}
async function finishQuery(conv, k, steps){
  const q = D.queries[k];
  await step(steps, '查询执行', '计算中', async () => ({sum: q.kind === 'query' ? `按${q.group_by}分组求和，${q.rows.length} 组` : `两期分别求和后相减${q.rows.length > 1 ? `，${q.rows.length} 个品类` : ''}`,
    body: `<div class="xp-line"><span class="k">怎么算</span>${esc(q.how)}</div>` + rawToggle('查看执行的计算', q.code)}));
  const v = verifyQuery(q);
  const ck = await step(steps, '结果校验', '核对加总', async () => v.ok
    ? {sum: v.sum, body: v.rows}
    : {sum: '没有通过，结果不展示', state: 'stop', body: v.rows, fail: true});
  if (ck.fail){ addMsg(conv, 'bot', '<div class="msg-text">结果没有通过校验，为了不把错的数给出去，这次不展示结果。</div>'); return; }
  addMsg(conv, 'bot', q.kind === 'query' ? queryCard(q) : compareCard(q));

}
function sourceFoot(q){

function queryCard(q){
